name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Check the recorded session is present
        run: |
          test -s ui/data/session.js || { echo "ui/data/session.js missing"; exit 1; }
          test -s ui/data/bench.js   || { echo "ui/data/bench.js missing"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui
      - id: deployment
        uses: actions/deploy-pages@v4
