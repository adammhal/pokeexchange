name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure
        # Fewer differential flows here: see the note in CMakeLists.txt. The
        # full 10,000 still run in the optimised builds above.
        run: >
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DPOKEX_SANITIZE=ON
          -DPOKEX_DIFF_FLOWS=1200
      - name: Build
        run: cmake --build build-asan -j
      # Everything except the 1,000,000-message fuzz run. Under ASan and UBSan in
      # a Debug build, that test costs about 30s per book version, times four
      # versions, which is most of the job for little extra coverage: the
      # property tests already drive every book through the same invariants
      # under the same sanitizers. The full fuzz run still executes in the
      # optimised build on both Linux and macOS above.
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure -E "long random run"

      - name: Fuzz under sanitizers (shorter)
        run: ./build-asan/pokex-tests "[property]" --order rand

  # The cache-miss evidence for the v0-to-v1 claim.
  #
  # `perf stat` cannot read hardware events on a virtualised runner, so this
  # uses cachegrind, which SIMULATES a cache instead. That makes these modelled
  # figures rather than measurements: the direction and rough magnitude are
  # meaningful, the absolute numbers are not a claim about any real CPU. It is
  # the honest way to get the evidence without renting a bare-metal box.
  cache-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPOKEX_BUILD_TESTS=OFF

      - name: Build the profiling target
        run: cmake --build build -j --target pokex-profile

      - name: Profile each book version
        run: |
          for book in v0 v1 v2 v3; do
            echo "::group::cachegrind $book"
            valgrind --tool=cachegrind --cache-sim=yes --branch-sim=no \
                     --cachegrind-out-file=/tmp/cg.$book.data \
                     ./build/pokex-profile "$book" --scenario mixed \
                       --resident 120000 --levels 4096 --messages 60000 \
                     2> "/tmp/cg.$book.txt"
            tail -20 "/tmp/cg.$book.txt"
            echo "::endgroup::"
          done

      - name: Summarise
        run: |
          {
            echo "### Simulated cache behaviour"
            echo
            echo "Cachegrind models a cache rather than reading hardware counters,"
            echo "so these are modelled figures. Direction and magnitude are"
            echo "meaningful; the absolute values are not a claim about a real CPU."
            echo
            python3 tools/parse_cachegrind.py \
              v0=/tmp/cg.v0.txt v1=/tmp/cg.v1.txt \
              v2=/tmp/cg.v2.txt v3=/tmp/cg.v3.txt
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: cachegrind
          path: /tmp/cg.*
